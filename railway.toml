# Railway Monorepo Configuration for AskWRI
# This file defines two services that run together:
# 1. hybrid-service: Python/FastAPI backend (port 8002)
# 2. frontend: Next.js frontend (port 3000)

# ============================================================================
# HYBRID SERVICE (Python/FastAPI Backend)
# ============================================================================
[build]
builder = "NIXPACKS"
buildCommand = "echo 'Root build - services build separately'"

[[services]]
name = "askwri-hybrid-service"
serviceName = "hybrid-service"

[services.build]
builder = "NIXPACKS"
buildCommand = "cd hybrid-service && pip install -r requirements.txt"

[services.deploy]
startCommand = "cd hybrid-service && python main.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[services.healthcheck]
path = "/health"
port = 8002
timeout = 30
interval = 10

# ============================================================================
# FRONTEND SERVICE (Next.js)
# ============================================================================
[[services]]
name = "askwri-frontend"
serviceName = "frontend"

[services.build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build"

[services.deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[services.healthcheck]
path = "/"
port = 3000
timeout = 30
interval = 10
