# =============================================================================
# Destroy Infrastructure Workflow
# Manually triggered to tear down an environment
# =============================================================================

name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy (qa or production)'
        required: true
        type: choice
        options:
          - qa
          - production
      confirm:
        description: 'Type "DESTROY" to confirm'
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: askwri-app

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Destroy Request
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}

    steps:
      - name: Validate confirmation
        id: check
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo "❌ Confirmation failed. You must type 'DESTROY' to confirm."
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "✅ Confirmation validated"
          echo "proceed=true" >> $GITHUB_OUTPUT

  destroy:
    name: Destroy ${{ github.event.inputs.environment }} Infrastructure
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.proceed == 'true'
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1

      - name: Terraform Init
        working-directory: terraform/infrastructure
        run: |
          terraform init \
            -backend-config="../environments/${{ github.event.inputs.environment }}.backend.hcl"

      - name: Terraform Destroy
        working-directory: terraform/infrastructure
        run: |
          terraform destroy \
            -var-file="../environments/${{ github.event.inputs.environment }}.tfvars" \
            -auto-approve

      - name: Cleanup Complete
        run: |
          echo "🗑️ Infrastructure for ${{ github.event.inputs.environment }} has been destroyed"
