# =============================================================================
# Pull Request Workflow
# Runs tests and validates Terraform on all pull requests
# =============================================================================

name: Pull Request Check

on:
  pull_request:
    branches:
      - main
      - production
      - qa

permissions:
  contents: read
  pull-requests: write

jobs:
  # ==========================================================================
  # Build and Test
  # ==========================================================================
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test:ci

      - name: Build application
        run: npm run build

  # ==========================================================================
  # Python Tests (Search Service + Worker)
  # ==========================================================================
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    # DB-backed worker tests create scratch databases (askwri_worker_test etc.)
    # against localhost:5432 as user askwri — POSTGRES_USER makes askwri the
    # container superuser, so CREATE DATABASE works. REQUIRE_DB_TESTS=1 makes
    # the conftest guard fail loudly instead of silently skipping.
    env:
      DATABASE_URL: postgresql://askwri:password@localhost:5432/postgres
      REQUIRE_DB_TESTS: '1'

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: askwri
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The scratch-DB fixtures apply the TypeORM schema via `npm run migration:run`
      # (subprocess from the repo root), so Node + npm deps are required here too.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Install dependencies
        working-directory: search-service
        run: pip install -r requirements.txt

      - name: Install dev dependencies
        working-directory: search-service
        run: pip install -r requirements-dev.txt

      # Selection: hermetic tests (test_sparse_keyword, test_cite_doc_ids_filter)
      # plus scratch-DB tests that self-provision against DATABASE_URL
      # (test_migration_script, test_build_sparse_script). test_pg_store and
      # test_query_e2e need the migrated 169-doc corpus / qa DB and stay
      # local-only.
      - name: Run tests
        working-directory: search-service
        run: pytest tests/test_indexing.py tests/test_worker_queue.py tests/test_worker_stages.py tests/test_sparse_keyword.py tests/test_cite_doc_ids_filter.py tests/test_migration_script.py tests/test_build_sparse_script.py -v

  # ==========================================================================
  # Docker Build Test
  # ==========================================================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (Next.js)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image (Search Service)
        uses: docker/build-push-action@v7
        with:
          context: ./search-service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Terraform Validation
  # ==========================================================================
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.1

      - name: Terraform Format Check
        working-directory: terraform/infrastructure
        run: terraform fmt -check -recursive

      - name: Terraform Init (QA)
        working-directory: terraform/infrastructure
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform/infrastructure
        run: terraform validate
