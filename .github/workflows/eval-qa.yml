# =============================================================================
# QA Evalset Run
# Scores the gen-2 evalsets against deployed QA through its public gateway —
# no secrets, no database, no AWS credentials. Runs after every QA deploy, and
# on demand.
# =============================================================================

name: QA Evalset

on:
  workflow_dispatch:
  # The evalset scores what is *live* on QA, so it has to follow the rollout
  # rather than the merge: a push trigger on `qa` would race the deploy and
  # score the previous build. `Deploy to QA` only completes once ECS reports
  # service stability, so its completion is the signal that the new code is
  # serving. This also inherits the deploy's paths-ignore — docs-only pushes
  # deploy nothing and so score nothing.
  workflow_run:
    workflows: ['Deploy to QA']
    types:
      - completed
  # TEMPORARY: workflow_dispatch and workflow_run only become available once
  # this file is on the default branch, so this trigger is how the workflow
  # gets exercised beforehand. Remove it before merging.
  push:
    branches:
      - feat/eval-qa-workflow

permissions:
  contents: read

jobs:
  eval:
    name: Run evalsets against QA
    runs-on: ubuntu-latest
    # A failed or cancelled deploy leaves QA serving the old build; scoring it
    # would attribute the old numbers to the new commit.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # The sets run sequentially with a 120s per-query ceiling. 30 minutes is
    # headroom for a slow gateway without burning an hour on a hung one.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      # The pinned submodule commit is what makes a report traceable to its
      # ground truth; these runs want the newest fixtures instead. Move to the
      # tip of main for this run only and record which commit that was, both in
      # the log and on the summary — the pointer committed in the repo is left
      # untouched.
      - name: Use latest eval fixtures
        run: |
          git -C evaluation/eval-review fetch --depth 1 origin main
          git -C evaluation/eval-review checkout FETCH_HEAD
          echo "FIXTURES_SHA=$(git -C evaluation/eval-review rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Fixtures: $(git -C evaluation/eval-review rev-parse HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # pipefail matters: the default shell is `bash -e {0}` without it, so a
      # failing eval would be masked by tee's exit code and report green.
      - name: Run evalsets
        run: |
          set -o pipefail
          npm run --silent eval:qa 2>&1 | tee "$RUNNER_TEMP/eval.log"

      # The console report is what a human actually reads. Mirror it onto the
      # run summary so the numbers are visible without opening the log. The
      # fence preserves the report's column alignment, which Markdown would
      # otherwise collapse.
      - name: Publish report to job summary
        if: always()
        env:
          # On a workflow_run the checkout is the default-branch tip, which is
          # not necessarily the commit that was deployed — head_sha is what QA
          # is actually serving. The fallback covers the dispatch and push
          # triggers, where the checked-out commit is the subject.
          QA_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          {
            echo "QA commit under test: \`$QA_SHA\`"
            echo ""
            echo "Fixtures: \`${FIXTURES_SHA:-unresolved}\`"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/eval.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The JSON reports are the run's only durable output — keep them even
      # when a set fails partway through.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evalset-results
          path: evaluation/results/
