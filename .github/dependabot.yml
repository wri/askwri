version: 2
updates:
  # npm (Next.js app)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    versioning-strategy: 'increase-if-necessary'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # pip (search-service)
  - package-ecosystem: 'pip'
    directory: '/search-service'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Docker (root)
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Docker (search-service)
  - package-ecosystem: 'docker'
    directory: '/search-service'
    schedule:
      interval: 'monthly'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Terraform (infrastructure)
  - package-ecosystem: 'terraform'
    directory: '/terraform/infrastructure'
    schedule:
      interval: 'monthly'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # Terraform (backend-setup)
  - package-ecosystem: 'terraform'
    directory: '/terraform/backend-setup'
    schedule:
      interval: 'monthly'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
